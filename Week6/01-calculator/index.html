<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Example 1 - Interactive Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Example 1 - Interactive Calculator</h1>
    <p>Enter two numbers and select an operation.</p><input id="first" type="number" placeholder="First number"><input
        id="second" type="number" placeholder="Second number">
    <select id="operation">
        <option value="add">Add</option>
        <option value="subtract">Subtract</option>
        <option value="multiply">Multiply</option>
        <option value="divide">Divide</option>
    </select>
    <button id="calculate">Calculate</button>
    <p id="result" class="result"></p>
</body>

</html>
