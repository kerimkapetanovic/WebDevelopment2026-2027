<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Example 3 - Student Grade Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Example 3 - Student Grade Tracker</h1>
    <p>Add students and their grades (1-5).</p><input id="studentName" placeholder="Student name"><input id="grade"
        type="number" min="1" max="5" placeholder="Grade"><button id="add">Add Student</button>
    <p id="error"></p>
    <h2>Students</h2>
    <ul id="students"></ul>
    <p id="summary">Students: 0 | Average grade: —</p>
</body>

</html>
