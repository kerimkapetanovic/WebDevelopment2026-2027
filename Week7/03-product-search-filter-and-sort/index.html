<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Product Search and Filter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Product Search & Filter</h1>

        <label for="search">Search Products:</label>
        <input type="text" id="search" placeholder="Enter product name">

        <label for="maxPrice">Maximum Price:</label>
        <input type="number" id="maxPrice" placeholder="Enter maximum price">

        <label for="sort">Sort Products:</label>
        <select id="sort">
            <option value="default">Default Order</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="abc">Name: A to Z</option>
            <option value="zyx">Name: Z to A</option>
        </select>

        <button id="filterBtn">Apply Filters</button>
        <button id="resetBtn">Reset</button>

        <p id="count"></p>
        <ul id="productList"></ul>
    </div>
</body>

</html>
