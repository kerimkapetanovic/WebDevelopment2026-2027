<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Calculator & Debugging</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Safe Calculator & Debugging</h1>
        <label for="num1">First number</label><input id="num1" type="number" step="any" placeholder="First number"><label for="num2">Second number</label><input id="num2" type="number" step="any" placeholder="Second number"><label for="operation">Operation</label><select id="operation"><option value="add">Addition (+)</option><option value="divide">Division (/)</option></select><button id="calculateBtn">Calculate</button><p id="result" aria-live="polite"></p>
    </main>
</body>
</html>
