<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox and Grid</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Flexbox and CSS Grid</h1>
  <h2>1. Flexbox - Horizontal Layout</h2>
  <div class="flex-container">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
  </div>
  <h2>2. Flexbox - Centering</h2>
  <div class="center-container">
    <div class="item">Centered!</div>
  </div>
  <h2>3. Flex Direction</h2>
  <div class="column-container">
    <div class="item">First</div>
    <div class="item">Second</div>
    <div class="item">Third</div>
  </div>
  <h2>4. Flex Wrap</h2>
  <div class="wrap-container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
  </div>
  <h2>5. CSS Grid</h2>
  <div class="grid-container">
    <div class="item">Grid 1</div>
    <div class="item">Grid 2</div>
    <div class="item">Grid 3</div>
    <div class="item">Grid 4</div>
    <div class="item">Grid 5</div>
    <div class="item">Grid 6</div>
  </div>
</body>

</html>
