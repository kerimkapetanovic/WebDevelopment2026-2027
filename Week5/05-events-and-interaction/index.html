<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Events</title>
  <script src="script.js" defer></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    button { padding: 10px; margin: 5px; }
    .box { background-color: lightblue; padding: 20px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>JavaScript Events</h1>
  <h2>1. Click Event</h2>
  <p>Counter: <span id="counter">0</span></p>
  <button id="increase">Increase</button>
  <button id="decrease">Decrease</button>
  <button id="reset">Reset</button>

  <h2>2. Input Event</h2>
  <label for="name">Enter your name:</label>
  <input type="text" id="name">
  <p>Hello, <span id="nameOutput">Guest</span>!</p>

  <h2>3. Mouse Events</h2>
  <div class="box" id="colorBox">Move your mouse over this box!</div>

  <h2>4. Form Submission</h2>
  <form id="myForm">
    <label for="email">Email:</label>
    <input type="email" id="email" required>
    <button type="submit">Submit</button>
  </form>
  <p id="formMessage"></p>
</body>
</html>
