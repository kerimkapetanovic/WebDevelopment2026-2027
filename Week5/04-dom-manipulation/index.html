<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>DOM Manipulation</title>
  <script src="script.js" defer></script>
  <style>
    .highlight {
      background-color: yellow;
      padding: 10px;
    }

    .dark {
      background-color: #222;
      color: white;
    }
  </style>
</head>

<body>
  <h1 id="title">DOM Manipulation</h1>

  <p id="description">This is the original paragraph.</p>

  <button id="changeText">Change Text</button>
  <button id="changeStyle">Change Style</button>
  <button id="toggleTheme">Toggle Dark Mode</button>

  <h2>My List</h2>
  <ul id="myList">
    <li>First item</li>
    <li>Second item</li>
  </ul>
  <button id="addItem">Add Item</button>

  <h2>innerHTML vs textContent vs nodeValue</h2>

  <p id="example">Hello <strong>World</strong>!</p>

  <button id="innerButton">Use innerHTML</button>
  <button id="textButton">Use textContent</button>
  <button id="nodeButton">Use nodeValue</button>

  <p id="output">Original text</p>

  
  <p id="example1">Welcome to <strong>CS412</strong></p>

</body>

</html>
