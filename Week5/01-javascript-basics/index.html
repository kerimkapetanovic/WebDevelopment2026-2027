<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Basics</title>
  <!-- External JavaScript; defer waits for HTML to be parsed -->
  <script src="script.js" defer></script>
  <!-- Internal JavaScript -->
  <script>console.log("Hello from internal JavaScript!");</script>
</head>
<body>
  <h1>JavaScript Basics</h1>
  <!-- Inline JavaScript -->
  <button onclick="alert('Hello from inline JavaScript!')">Inline JavaScript</button>
  <h2>Variables and Output</h2>
  <p id="message">Original text</p>
  <p>Open the browser console (F12) to see the output.</p>
</body>
</html>
